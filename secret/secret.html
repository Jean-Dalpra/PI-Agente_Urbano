<audio id="bgm" loop>

<script>
  const cursores = [
    "auto",
    "default",
    "none",
    "context-menu",
    "help",
    "pointer",
    "progress",
    "wait",
    "cell",
    "crosshair",

    "sw-resize",
    "ew-resize",
    "ns-resize",
    "nesw-resize",
    "nwse-resize",
    "zoom-in",
    "zoom-out"
];

setInterval(() => {
    const cursor = cursores[Math.floor(Math.random() * cursores.length)];
    document.body.style.cursor = cursor;
}, 90);
const bgm = document.getElementById("bgm");
let musicStarted = false;
document.addEventListener("keydown", (e) => {
    const keys = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "z",
        "Z"
    ];
    if (!musicStarted && keys.includes(e.key)) {
        musicStarted = true;
        bgm.play().catch(err => console.log(err));
    }
});
</script>
